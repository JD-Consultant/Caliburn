name: product-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: product-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: caliburn_test
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: caliburn_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U caliburn_test -d caliburn_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUTF8: "1"
      CALIBURN_POSTGRES_PASSWORD: synthetic-container-password
      CALIBURN_REBUILD_TEST_DATABASE_URL: postgresql+psycopg://caliburn_test:synthetic-test-password@127.0.0.1:5432/caliburn_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.0.0
        with:
          version: 12.5.1
          runtime: node@24.19.0
          cache: true
          install: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/backend --locked
      - name: Check product and real PostgreSQL behavior
        run: |
          pnpm check
          pnpm test:integration
          pnpm test:docker
      - name: Build the standalone application image
        run: docker compose build app
      - name: Initialize the isolated container database and start the app
        run: |
          docker compose up -d --wait postgres qdrant
          docker compose run --rm app python -m caliburn.migrate upgrade head
          docker compose up -d --wait app
      - name: Verify the installed app, same-origin Web, database and PDF
        env:
          CALIBURN_SMOKE_URL: http://127.0.0.1:8101
        run: pnpm test:smoke
      - name: Stop this job's isolated deployment
        if: always()
        run: docker compose down
