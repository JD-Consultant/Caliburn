# API test CI(vNext V2-B;durable persistence plan §3.1/§3.4):
# 完整 pytest suite + PostgreSQL 16 整合測試(migration/repository/outbox/recovery)。
# TEST_DATABASE_URL 在 CI 必設——require_postgres fixture 會把「未設 URL」判 fail,
# 不允許 persistence tests 以 skipped 假通過。淘汰的 v3 promptfoo PR workflow 已移除。
name: api-tests

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: password, POSTGRES_DB: caliburn }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: migrate(alembic upgrade head)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/caliburn
        run: |
          uv sync
          uv run alembic upgrade head
      - name: pytest(full suite + PostgreSQL integration)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/caliburn
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/caliburn
          PYTHONUTF8: "1"
        run: uv run pytest -q
