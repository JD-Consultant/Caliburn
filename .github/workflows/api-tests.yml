# Formal Caliburn JD App gate. This intentionally follows the repository-root
# pnpm entrypoint instead of reconstructing a second CI-only command graph.
name: product-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: jd_test
          POSTGRES_PASSWORD: jd-local-test-only
          POSTGRES_DB: caliburn_jd_relational_test
        ports: ["55436:5432"]
        options: >-
          --health-cmd "pg_isready -U jd_test -d caliburn_jd_relational_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.5.1
          runtime: node@24.19.0
          cache: true
          install: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: experiments/jd-relational-app/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project experiments/jd-relational-app --frozen
      - name: Initialize isolated PostgreSQL 18.6 fixtures
        working-directory: experiments/jd-relational-app
        run: |
          uv run --frozen python scripts/init_test_database.py
          uv run --frozen python scripts/init_test_runtime.py
          uv run --frozen python scripts/init_test_runtime.py --schema jd_host_test
          uv run --frozen python scripts/init_test_runtime.py --schema jd_ai_host_test
          uv run --frozen python scripts/init_test_memory.py
      - name: Run the repository product gate
        env:
          JD_RELATIONAL_TEST_DB: "1"
          PYTHONUTF8: "1"
        run: pnpm check
