# Fast pull-request smoke only. Full PostgreSQL, browser, provider, and complete
# product verification are run deliberately before delivery and recorded in docs.
name: product-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: product-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.0.0
        with:
          version: 12.5.1
          runtime: node@24.19.0
          cache: true
          install: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: experiments/jd-relational-app/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project experiments/jd-relational-app --frozen
      - name: Run fast product smoke
        env:
          PYTHONUTF8: "1"
        run: |
          node --test scripts/run-jd-app.test.mjs
          pnpm --filter @caliburn/jd-relational-app run codegen:check
          uv run --project experiments/jd-relational-app --frozen --offline pytest -q -p no:cacheprovider experiments/jd-relational-app/tests/test_schema_projection.py experiments/jd-relational-app/tests/test_operator_entry.py experiments/jd-relational-app/tests/test_working_state.py
          pnpm --filter @caliburn/jd-relational-web run typecheck
