# Fast pull-request smoke only. Real PostgreSQL, browser, provider, and complete
# product verification are run deliberately before delivery and recorded in docs.
name: product-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: product-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.0.0
        with:
          version: 12.5.1
          runtime: node@24.19.0
          cache: true
          install: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --locked
      - name: Lint, type-check, test (no database) and build
        env:
          PYTHONUTF8: "1"
        run: pnpm run check
