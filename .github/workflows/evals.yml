# evals CI(T11;ADR 0030):prompts/skills/引擎碼變更 → promptfoo before-vs-after,
# 紅燈擋 merge(調教閉環:改 skill=自動跑 regression)。
# 需要 repo secrets:OPENROUTER_API_KEY;引擎由 job 內起(db 用 service container)。
name: evals

on:
  pull_request:
    paths:
      - "apps/api/app/interview/**"
      - "apps/api/evals/**"

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: password, POSTGRES_DB: caliburn }
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 起引擎(api:8001)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/caliburn
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          uv sync
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8001 &
          sleep 5
      - name: promptfoo eval
        uses: promptfoo/promptfoo-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: apps/api/evals/promptfooconfig.yaml
          cache-path: ~/.cache/promptfoo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
