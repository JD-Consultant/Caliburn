[project]
name = "caliburn-backend"
version = "0.1.0"
license = "MIT"
description = "Caliburn local interview and job-description application backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "psycopg[binary,pool]==3.3.6",
    "sqlalchemy[asyncio]==2.1.1",
    "alembic==1.20.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "tenacity==9.1.4",
    "openai==3.20.0",
    "httpx2==2.13.1",
    "rapidfuzz==3.14.6",
    "playwright==1.63.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliburn"]

[tool.uv]
required-version = "==0.12.20"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts", "tests/integration"]
# Tests import shared fixtures as `tests.fixtures...`; this keeps that working when pytest is
# started from the repository root (the documented `pnpm test`) and not only from apps/api.
pythonpath = ["."]
asyncio_mode = "auto"
# 不同測試層可沿受測責任同名；避免 prepend 模式把它們載入同一頂層 module。
addopts = "--strict-markers --import-mode=importlib"
markers = ["postgres: requires an explicitly configured isolated PostgreSQL database"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/caliburn/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "N", "A", "RUF006", "RUF100"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/caliburn"]
