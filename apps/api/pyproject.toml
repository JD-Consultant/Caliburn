[project]
name = "caliburn-backend"
version = "0.1.0"
license = "MIT"
description = "Caliburn local interview and job-description application backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "psycopg[binary,pool]==3.3.6",
    "sqlalchemy[asyncio]==2.1.1",
    "alembic==1.20.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "tenacity==9.1.4",
    "openai==3.20.0",
    "httpx2==2.13.1",
    "rapidfuzz==3.14.6",
    "playwright==1.63.0",
    "jsonschema[format-nongpl]==4.26.0",
    "anyio==4.15.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.20"
build-constraint-dependencies = [
