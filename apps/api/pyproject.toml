[project]
name = "caliburn-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy[asyncio]==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
  "openpyxl==3.1.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "opentelemetry-sdk==1.42.1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "langchain==1.3.15",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-openrouter==0.2.7",
  "deepagents==0.7.5",
  "job-analysis-contract",
]

[tool.uv.sources]
job-analysis-contract = { path = "../../packages/job-analysis-contract", editable = true }

# 應用程式（非函式庫）：無 [build-system] → uv 視為非套件專案，只管 venv 與依賴。
# import 名仍為 `app`（pytest.ini 的 pythonpath=. 提供）；rename → caliburn_api 屬 Phase 3。

[dependency-groups]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "respx==0.21.1"]
