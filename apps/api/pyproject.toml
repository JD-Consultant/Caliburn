[project]
name = "caliburn-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy[asyncio]==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
  "langchain==1.3.9",
  "langchain-core==1.4.7",
  "langgraph==1.2.5",
  "langgraph-checkpoint-postgres==3.1.0",
  "ag-ui-langgraph==0.0.41",
  "langchain-openai==1.3.2",
  "jinja2==3.1.4",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "reportlab==4.2.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "email-validator==2.3.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.12",
  "httpx==0.27.2",
  "opentelemetry-sdk==1.42.1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "indexer-contract",
  "job-analysis-contract",
  "openai==2.46.0",
]

[tool.uv.sources]
indexer-contract = { path = "../../packages/indexer-contract", editable = true }
job-analysis-contract = { path = "../../packages/job-analysis-contract", editable = true }

# 應用程式（非函式庫）：無 [build-system] → uv 視為非套件專案，只管 venv 與依賴。
# import 名仍為 `app`（pytest.ini 的 pythonpath=. 提供）；rename → caliburn_api 屬 Phase 3。

[dependency-groups]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "respx==0.21.1"]
