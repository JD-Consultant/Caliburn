[project]
name = "caliburn-backend"
version = "0.1.0"
description = "Caliburn application backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "indexer-contract",
    "langchain-core>=1.7,<1.8",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langgraph-prebuilt>=1.1,<1.2",
    "ocs-contract",
    "openai>=3.42,<4",
    "pdfplumber==0.11.10",
    "playwright==1.63.0",
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14.1,<3",
    "qdrant-client==1.20.0",
    "rapidfuzz==3.14.6",
    "sqlalchemy>=2.1.5,<2.2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
local-models = [
    "torch==2.14.1",
    "transformers==5.22.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/src/caliburn/modules/occupation_reference/data"]

[tool.hatch.build.targets.wheel]
packages = ["src/caliburn"]

[dependency-groups]
dev = [
    "httpx2>=2.14,<3",
    "import-linter>=2.15,<3",
    "jsonschema>=4.20,<5",
    "mypy",
    "pytest",
    "ruff",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.uv.sources]
ocs-contract = { path = "../../packages/ocs-contract" }
indexer-contract = { path = "../../packages/indexer-contract" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
