[project]
name = "jd-ocs-indexer"
version = "0.1.0"
license = "MIT"
description = "OCS JSON -> Qdrant indexer for JD Authoring RAG"
readme = "README.md"
authors = [
    { name = "ArIs0x145", email = "aris0x145@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Embedding (BGE-M3 dense+sparse) is served by apps/embedder over HTTP (ADR 0012):
    # no torch/FlagEmbedding/transformers in-process here — that lived on the Windows host
    # and caused OMP segfault + torch._dynamo double-register. The indexer is now pure Python.
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "httpx>=0.27",
    "rich>=15.0.0",
    "typer>=0.26.1",
    "ocs-contract",
    "indexer-contract",
]

[project.scripts]
jd-ocs-indexer = "jd_ocs_indexer.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "anyio==4.13.0"]
dev = ["pytest>=8", "httpx2>=2.13.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv.sources]
ocs-contract = { path = "../../packages/ocs-contract", editable = true }
indexer-contract = { path = "../../packages/indexer-contract", editable = true }

[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

