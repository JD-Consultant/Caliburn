[project]
name = "jd-ocs-indexer"
version = "0.1.0"
description = "OCS JSON -> Qdrant indexer for JD Authoring RAG"
readme = "README.md"
authors = [
    { name = "ArIs0x145", email = "aris0x145@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flagembedding>=1.4.0",
    # Pin transformers to 4.x: FlagEmbedding 1.4.0 targets transformers 4.x; the 5.x
    # rewrite breaks BGE-M3 at query time (lazy sonicmoe→torch._dynamo double-register
    # AssertionError) and is unstable with torch 2.12. Its declared <6 bound is too loose.
    "transformers>=4.44.2,<5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "httpx>=0.27",
    "rich>=15.0.0",
    "torch>=2.12.0",
    "typer>=0.26.1",
    "ocs-contract",
    "indexer-contract",
]

[project.scripts]
jd-ocs-indexer = "jd_ocs_indexer.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

# On Windows, CUDA torch isn't on PyPI — pull it from the official PyTorch index.
# Marker keeps non-Windows resolving torch from PyPI as usual.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
ocs-contract = { path = "../../packages/ocs-contract", editable = true }
indexer-contract = { path = "../../packages/indexer-contract", editable = true }

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
