[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jd-pdf-to-json"
version = "0.1.0"
description = "Convert OCS vocational competency PDFs to structured JSON"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ArIs0x145", email = "aris0x145@gmail.com"}]
license = {text = "MIT"}
keywords = ["OCS", "competency", "PDF", "JSON", "iCAP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "pydantic>=2.0,<3",
    "pdfplumber>=0.10,<1",
    "typer[all]>=0.9,<1",
    "jsonschema>=4.20,<5",
    "loguru>=0.7,<1",
    "ocs-contract",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "pytest-mock>=3.11,<4",
    "black>=23.9,<24",
    "ruff>=0.1,<1",
    "mypy>=1.5,<2",
    "types-jsonschema>=4.20",
]

[tool.uv.sources]
ocs-contract = { path = "../../packages/ocs-contract", editable = true }

[project.scripts]
jd-convert = "jd_pdf_to_json.cli:app"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "W",      # pycodestyle, Pyflakes, pycodestyle warnings
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
]
ignore = ["E501"]  # line-length, handled by black

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-markers --cov=src/jd_pdf_to_json --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src/jd_pdf_to_json"]
branch = true
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
