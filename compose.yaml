name: caliburn-rebuild

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: caliburn
      POSTGRES_DB: caliburn
      POSTGRES_PASSWORD: ${CALIBURN_POSTGRES_PASSWORD:?Set a URL-safe database password}
    ports:
      - "127.0.0.1:${CALIBURN_POSTGRES_PORT:-55441}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "caliburn", "-d", "caliburn"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:${CALIBURN_QDRANT_PORT:-6335}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; read -r status <&3; [[ \"$$status\" == *' 200 '* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    init: true
    env_file:
      - path: ${CALIBURN_APP_ENV_FILE:-./.local/app.env}
        required: false
    environment:
      CALIBURN_REBUILD_DATABASE_URL: postgresql+psycopg://caliburn:${CALIBURN_POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/caliburn
      CALIBURN_REBUILD_REFERENCE_CONFIG: /opt/caliburn/reference.json
    volumes:
      - type: bind
        source: ${CALIBURN_LOCAL_DIRECTORY:-./.local}
        target: /opt/caliburn/local
        read_only: true
      - type: bind
        source: ${CALIBURN_REFERENCE_CONFIG_FILE:-./docker/reference.json}
        target: /opt/caliburn/reference.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${CALIBURN_APP_PORT:-8101}:8101"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    shm_size: 256mb
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  qdrant_data:
