# Local infra for the current Caliburn Web app: PostgreSQL only.
# API and Web run on the host; schema is managed by Alembic.
# Qdrant + embedder (RAG bounded context) are present but optional — opt in with
# the `rag` Compose profile (`docker compose --profile rag up -d`).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: caliburn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2          # pin；對齊 qdrant-client>=1.18（apps/ocs-indexer）
    profiles: [rag]
    ports:
      - "6333:6333"                        # REST（indexer 走這個，prefer_grpc=False）
      - "6334:6334"                        # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage     # named volume（Windows 友善，官方建議）
    healthcheck:
      # image 內有 bash 但無 curl → 用 bash /dev/tcp 探 REST port（已實測 TCP_OK）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 本地非公開 → 不設 API key（QDRANT__SERVICE__API_KEY）；indexer QDRANT_API_KEY 留空。

  embedder:
    build: ./apps/embedder
    image: caliburn-embedder:local
    profiles: [rag]
    gpus: all                              # RTX 4060 已驗證（Docker Desktop + WSL2 nvidia）
    ports:
      - "8082:80"                          # indexer EMBEDDER_URL=http://localhost:8082
    environment:
      MODEL_ID: BAAI/bge-m3
      DEVICE: cuda
      USE_FP16: "true"
    volumes:
      - hf_cache:/root/.cache/huggingface  # 避免每次重抓 BGE-M3 權重
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s                   # 首次載入/下載模型較久
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_storage:
  hf_cache:
