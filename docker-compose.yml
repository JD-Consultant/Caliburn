# Local infra for Caliburn dev: Postgres (pgvector) + Qdrant.
# Apps run on the host (api via apps/api/run_live.py:8001, web via next dev:3000,
# indexer via `uv run jd-ocs-indexer serve`:8000) — only stateful infra is dockerized.
# (Compose v2 ignores the legacy `version:` key, so it is omitted.)

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobintel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema 由 Alembic 管（alembic upgrade head）；不再用 init.sql 自動建表（D25）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2          # pin；對齊 qdrant-client>=1.18（apps/ocs-indexer）
    container_name: jobintel_qdrant
    ports:
      - "6333:6333"                        # REST（indexer 走這個，prefer_grpc=False）
      - "6334:6334"                        # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage     # named volume（Windows 友善，官方建議）
    healthcheck:
      # image 內有 bash 但無 curl → 用 bash /dev/tcp 探 REST port（已實測 TCP_OK）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 本地非公開 → 不設 API key（QDRANT__SERVICE__API_KEY）；indexer QDRANT_API_KEY 留空。

volumes:
  pgdata:
  qdrant_storage:
