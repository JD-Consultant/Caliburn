[project]
name = "caliburn-jd-relational-probe"
version = "0.1.0"
description = "Isolated structured JD application core with relational storage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "itsdangerous==2.2.0",
    "jsonschema==4.26.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "anthropic==1.5.0",
    "datamodel-code-generator==0.79.0",
    "httpx2==2.12.0",
    "openai==3.13.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
