[project]
name = "caliburn-jd-relational-probe"
version = "0.1.0"
description = "Isolated structured JD command validation; no production persistence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "anthropic==1.5.0",
    "datamodel-code-generator==0.79.0",
    "httpx2==2.12.0",
    "openai==3.13.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
