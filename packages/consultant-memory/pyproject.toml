[project]
name = "caliburn-consultant-memory"
version = "0.1.0"
description = "Caliburn Memory artifacts and atomic publication"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.13",
    "langgraph==1.2.11",
    "markdown-it-py[linkify]==4.2.0",
    "sqlalchemy==2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliburn_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
