[project]
name = "job-analysis-contract"
version = "0.1.0"
description = "Caliburn Local Web job-analysis wire contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["datamodel-code-generator>=0.26", "jsonschema>=4.20", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_analysis_contract"]
