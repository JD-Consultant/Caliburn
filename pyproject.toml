[project]
name = "jd-ocs-indexer"
version = "0.1.0"
description = "OCS JSON -> Qdrant indexer for JD Authoring RAG"
readme = "README.md"
authors = [
    { name = "ArIs0x145", email = "aris0x145@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flagembedding>=1.4.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "rich>=15.0.0",
    "typer>=0.26.1",
]

[project.scripts]
jd-ocs-indexer = "jd_ocs_indexer.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
